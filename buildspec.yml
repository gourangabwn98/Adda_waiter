version: 0.2

env:
  parameter-store:
    VITE_API_URL:                 "/adda/frontend/VITE_API_URL"
    VITE_CAFE_NAME:               "/adda/frontend/VITE_CAFE_NAME"
    VITE_FIREBASE_API_KEY:        "/adda/frontend/VITE_FIREBASE_API_KEY"
    VITE_FIREBASE_AUTH_DOMAIN:    "/adda/frontend/VITE_FIREBASE_AUTH_DOMAIN"
    VITE_FIREBASE_PROJECT_ID:     "/adda/frontend/VITE_FIREBASE_PROJECT_ID"
    VITE_FIREBASE_APP_ID:         "/adda/frontend/VITE_FIREBASE_APP_ID"
    VITE_RECAPTCHA_SITE_KEY:      "/adda/frontend/VITE_RECAPTCHA_SITE_KEY"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "=== Installing dependencies ==="
      - npm ci

  pre_build:
    commands:
      - echo "=== Build started $(date) ==="
      - echo "Node version $(node -v)"
      - echo "NPM version $(npm -v)"

  build:
    commands:
      - echo "=== Running Vite build ==="
      - npm run build

  post_build:
    commands:
      - echo "=== Build completed $(date) ==="

artifacts:
  files:
    - dist/**/*
    - appspec.yml
    - scripts/**/*
  discard-paths: no

cache:
  paths:
    - node_modules/**/*