version: 0.2

env:
  parameter-store:
    VITE_API_URL: "/adda/frontend/VITE_API_URL"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "=== Installing dependencies ==="
      - npm ci

  pre_build:
    commands:
      - echo "=== Build started $(date) ==="
      - echo "Node version $(node -v)"
      - echo "NPM version $(npm -v)"

  build:
    commands:
      - echo "=== Running Vite build ==="
      - npm run build

  post_build:
    commands:
      - echo "=== Build completed $(date) ==="

artifacts:
  files:
    - dist/**/*
    - appspec.yml
    - scripts/**/*
  discard-paths: no

cache:
  paths:
    - node_modules/**/*