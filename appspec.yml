version: 0.0
os: linux

files:
  - source: dist/
    destination: /var/www/adda-frontend
    overwrite: yes

permissions:
  - object: /var/www/adda-frontend
    owner: ubuntu
    group: ubuntu
    mode: "755"
    type:
      - directory
  - object: /var/www/adda-frontend
    owner: ubuntu
    group: ubuntu
    mode: "644"
    type:
      - file

hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 60
      runas: root

  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 60
      runas: root

  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 30
      runas: root

  ValidateService:
    - location: scripts/validate.sh
      timeout: 30
      runas: root